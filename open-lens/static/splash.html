<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OpenLens DevOps — Loading</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #0D1117;
        color: #D3DCE6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        gap: 13px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img { width: 57px; height: 57px; }
      .wordmark { color: #EAF1FC; font-size: 27px; font-weight: 600; letter-spacing: -.5px; }
      .wordmark span { color: #7196D2; }
      .subtitle { color: #96A9C0; font-size: 12px; letter-spacing: 1.8px; }
      .progress-track {
        width: 252px; height: 2px; margin-top: 13px; overflow: hidden;
        background: #253244; border-radius: 3px;
      }
      .progress { height: 100%; width: 38%; background: #7196D2; animation: move 1.65s ease-in-out infinite alternate; }
      .status { font-size: 12px; color: #8795AA; }
      @keyframes move { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
      @media (prefers-reduced-motion: reduce) { .progress { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main aria-label="Loading OpenLens DevOps">
      <div class="brand">
        <img src="branding/openlens-devops-symbol.svg" alt="">
        <div class="wordmark">OpenLens <span>DevOps</span></div>
      </div>
      <div class="subtitle">KUBERNETES WORKSPACE</div>
      <div class="progress-track" role="progressbar" aria-label="Loading"><div class="progress"></div></div>
      <div class="status">Loading workspace...</div>
    </main>
  </body>
</html>
