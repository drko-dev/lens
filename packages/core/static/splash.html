<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OpenLens DevOps — Loading</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        background: #141414;
      }
      body {
        color: #C8C8C8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 24px;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .brand-icon {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
      }
      .wordmark {
        color: #C8C8C8;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }
      .wordmark span {
        color: #989898;
      }
      .subtitle {
        color: #989898;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 500;
      }
      .progress-track {
        width: 240px;
        height: 3px;
        margin-top: 10px;
        overflow: hidden;
        background: #141414;
        border-radius: 4px;
        position: relative;
      }
      .progress {
        position: absolute;
        height: 100%;
        width: 40%;
        background: #C8C8C8;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(139, 150, 165, 0.35);
        animation: move 1.6s ease-in-out infinite alternate;
      }
      .status {
        font-size: 12px;
        color: #989898;
        margin-top: 4px;
      }
      @keyframes move {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main aria-label="Loading OpenLens DevOps">
      <div class="brand">
        <!-- Inline graphite lens mark (no blue celestial SVG) -->
        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OpenLens DevOps Logo">
          <title>OpenLens DevOps</title>
          <circle cx="256" cy="256" r="220" fill="#2A2A2A"/>
          <circle cx="256" cy="256" r="168" fill="#3A3A3A"/>
          <circle cx="256" cy="256" r="96" fill="#1A1A1A"/>
          <circle cx="256" cy="256" r="42" fill="#5A5A5A"/>
          <circle cx="236" cy="236" r="14" fill="#8A8A8A" opacity="0.7"/>
        </svg>
        <div class="wordmark">OpenLens <span>DevOps</span></div>
      </div>
      <div class="subtitle">Kubernetes Workspace</div>
      <div class="progress-track" role="progressbar" aria-label="Loading"><div class="progress"></div></div>
      <div class="status">Loading workspace...</div>
    </main>
  </body>
</html>
