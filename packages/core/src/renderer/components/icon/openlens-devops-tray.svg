<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>OpenLens DevOps menu bar icon</title>
  <!-- Opaque lighter graphite 3D lens: rim + face + well; small iris -->
  <circle cx="32" cy="32" r="30" fill="#5A5A5A"/>
  <circle cx="32" cy="32" r="26" fill="#484848"/>
  <circle cx="32" cy="32" r="22" fill="#3E3E3E"/>
  <!-- Specular lip (opaque, not transparent) -->
  <path fill="#6A6A6A" d="M12 24c4-8 14-14 20-14 6 0 16 6 20 14-3-6-11-11-20-11S15 18 12 24z"/>
  <!-- Eye well -->
  <circle cx="32" cy="32" r="11" fill="#2A2A2A"/>
  <!-- Smaller iris ring -->
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#E4E4E4" stroke-width="2.5"/>
  <!-- Compact pupil -->
  <circle cx="32" cy="32" r="3.2" fill="#E4E4E4"/>
  <!-- Tiny catchlight -->
  <circle cx="30.2" cy="30.2" r="1.1" fill="#F5F5F5"/>
</svg>
